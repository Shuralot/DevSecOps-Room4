name: SCA
# Verifica PRs antes da integração, main após push e execução manual.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# O token só precisa ler o repositório; não concedemos escrita por padrão.
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.12'
jobs:
  audit:
    name: SCA - pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # SHA fixa o código da action; o Dependabot propõe atualizações.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pip-audit==2.10.1
      # SCA verifica bibliotecas de terceiros; uma CVE conhecida reprova o job.
      - run: pip-audit --require-hashes -r requirements.txt
