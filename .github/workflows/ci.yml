name: CI
# Verifica PRs antes da integração, main após push e execução manual.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# O token só precisa ler o repositório; não concedemos escrita por padrão.
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.12'
jobs:
  build-lint-test:
    name: CI - build lint testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # SHA fixa o código da action; o Dependabot propõe atualizações.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install ruff==0.17.1 pytest==9.1.1
      - run: ruff check app.py tests
      - run: python -m compileall -q app.py
      # Regressões comprovam que as correções preservam o fluxo da aplicação.
      - run: pytest -q
