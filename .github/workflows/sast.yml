name: SAST e segredos
# Verifica PRs antes da integração, main após push e execução manual.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# O token só precisa ler o repositório; não concedemos escrita por padrão.
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.12'
jobs:
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # SHA fixa o código da action; o Dependabot propõe atualizações.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install semgrep
      # --error reprova o job quando há achados; não é apenas um relatório.
      - run: semgrep scan --config=p/python --config=p/flask --config=p/security-audit --error .
  gitleaks:
    name: Segredos - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Busca o histórico: apagar um segredo do arquivo não o apaga dos commits.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
