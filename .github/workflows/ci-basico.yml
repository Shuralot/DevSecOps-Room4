

name: CI Basico - TaskFlow

on:
  # Roda a cada push direto no branch main.
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Permite disparar o workflow manualmente pela aba "Actions" do GitHub,
  # util para testes ou reprocessamentos sob demanda.
  workflow_dispatch:

jobs:
  # Nome do job - usado tambem para configurar o branch protection rule
  # ("Require status checks to pass before merging") no Encontro 2.

  build-e-lint:
    # Runner hospedado pelo proprio GitHub, com Ubuntu ja instalado.
    # Gratuito para repositorios publicos, com cota mensal para privados.
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe (py_compile)
        run: python -m py_compile app.py

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint
        run: ruff check .        

